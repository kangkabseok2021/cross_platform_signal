services:
  telemetry-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9001:9001"
    volumes:
      - ./tests/fixtures:/app/fixtures:ro
    restart: "on-failure:3"

  ws-client:
    image: python:3.12-slim
    depends_on:
      - telemetry-server
    command: >
      sh -c "pip install websockets --quiet &&
             sleep 4 &&
             python3 /scripts/ws_client.py"
    volumes:
      - ./scripts:/scripts:ro
    environment:
      WS_URL: ws://telemetry-server:9001
