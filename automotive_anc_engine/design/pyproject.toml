[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anc-design"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["anc"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
