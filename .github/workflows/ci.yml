name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpp-build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_DEFAULT_CMP0135=NEW

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Run GoogleTests
        run: ctest --test-dir build --build-config Release --output-on-failure -V

  ct-backend-test:
    name: CT backend — 6 GoogleTests (ubuntu, no Qt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TBB (for par_unseq on Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y libtbb-dev

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_DEFAULT_CMP0135=NEW
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build ct_core + test_ct
        run: cmake --build build --target test_ct -j 4

      - name: Run CT tests
        run: ctest --test-dir build --output-on-failure -R "FilterBank|Reconstructor"

  clang-tidy:
    name: clang-tidy — cppcoreguidelines + modernize (ct_core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: sudo apt-get update -qq && sudo apt-get install -y clang-tidy

      - name: Configure (generate compile_commands.json)
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_POLICY_DEFAULT_CMP0135=NEW

      - name: Run clang-tidy on ct_core
        run: |
          find ct_core/src ct_core/include -name '*.cpp' -o -name '*.h' | \
          xargs clang-tidy -p build --config-file=.clang-tidy 2>&1 | tee clang-tidy.log
          # Fail if any warnings emitted
          if grep -q "warning:" clang-tidy.log; then exit 1; fi

  audio-test:
    name: Audio engine — 13 GoogleTests + 7 QTests (ubuntu, Qt6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_DEFAULT_CMP0135=NEW
          -DBUILD_AUDIO=ON

      - name: Build audio targets
        run: cmake --build build --target test_audio_core test_audio_qt -j 4

      - name: Run core tests (no Qt)
        run: ctest --test-dir build --output-on-failure -R "IirFilter|AudioRingBuffer|AudioEngine"

      - name: Run Qt tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -R "test_audio_qt"

  telemetry-ema-test:
    name: Vehicle Telemetry — 6 EMA GoogleTests (ubuntu, no Qt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (EMA core only, no Qt, no httplib)
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_DEFAULT_CMP0135=NEW
          -DBUILD_TELEMETRY=ON
          -DBUILD_VT_HTTP=OFF

      - name: Build test_ema
        run: cmake --build build --target test_ema -j 4

      - name: Run EMA tests
        run: ctest --test-dir build --output-on-failure -R "EmaFilter"

  acoustic-engine-test:
    name: Acoustic Engine — 15 GoogleTests (C99 legacy + C++20 refactor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (acoustic subproject only)
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_DEFAULT_CMP0135=NEW
          -DBUILD_ACOUSTIC=ON

      - name: Build test_acoustic_core + demo targets
        run: cmake --build build --target test_acoustic_core demo_safe demo_leak -j$(nproc)

      - name: Run 15 GoogleTests
        run: ctest --test-dir build/acoustic_propagation_engine --output-on-failure -V

  ballistic-cpp-test:
    name: Ballistic engine — 8 GoogleTests (ubuntu, GCC-12)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC-12
        run: sudo apt-get update -qq && sudo apt-get install -y gcc-12 g++-12

      - name: Configure (standalone subproject)
        run: >
          cmake -S ballistic_trajectory_engine -B build-ballistic
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-12

      - name: Build
        run: cmake --build build-ballistic --parallel

      - name: Run 8 GoogleTests
        run: ctest --test-dir build-ballistic --output-on-failure -V

  ballistic-csharp-build:
    name: Ballistic dashboard — dotnet build + unit tests (Windows, no DLL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: dotnet build
        working-directory: ballistic_trajectory_engine
        run: dotnet build BallisticDashboard.sln --configuration Release

      - name: dotnet test (skips interop — DLL not available)
        working-directory: ballistic_trajectory_engine
        run: dotnet test BallisticDashboard.sln --configuration Release --filter "Category!=Interop" --verbosity normal

  ballistic-interop-test:
    name: Ballistic interop — C++ DLL + 5 xUnit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure C++ (MSVC)
        run: >
          cmake -S ballistic_trajectory_engine -B build-ballistic-msvc
          -DCMAKE_BUILD_TYPE=Release

      - name: Build native DLL
        run: cmake --build build-ballistic-msvc --config Release --target ballistic_engine

      - name: dotnet test (all tests including interop)
        working-directory: ballistic_trajectory_engine
        env:
          BALLISTIC_DLL_PATH: ${{ github.workspace }}\build-ballistic-msvc\Release\ballistic_engine.dll
        run: dotnet test BallisticDashboard.sln --configuration Release --verbosity normal

  cad-viewer-build:
    name: CAD Layout Viewer — Rust+C++ build + 10 tests (Qt6, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Qt6 + OpenGL + libGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev \
            libgl1-mesa-dev

      - name: Configure
        run: >
          cmake -S cad_layout_viewer -B build-cad
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_DEFAULT_CMP0135=NEW

      - name: Build (Rust + C++)
        run: cmake --build build-cad --parallel

      - name: Run 10 tests (6 GoogleTest + 4 QTest offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-cad --output-on-failure -V

  endoscopic-build-cpu:
    name: Endoscopic pipeline — CPU build + 4 pytest smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GStreamer + x264
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

      - name: Configure (ENABLE_CUDA=OFF)
        run: >
          cmake -S endoscopic_video_pipeline -B build-endo
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_CUDA=OFF
          -DCMAKE_POLICY_DEFAULT_CMP0135=NEW

      - name: Build
        run: cmake --build build-endo --parallel

      - name: Install Python test deps
        run: pip3 install pytest opencv-python-headless --quiet

      - name: Run 4 pytest smoke tests
        env:
          ENDOSCOPIC_BIN: ${{ github.workspace }}/build-endo/endoscopic_pipeline
        run: pytest endoscopic_video_pipeline/tests/ -v --tb=short

  automotive-anc-engine-test:
    name: Automotive ANC Engine — 22 GoogleTests + 13 pytest (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - name: Configure (standalone subproject)
        run: >
          cmake -S automotive_anc_engine -B build-anc
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_DEFAULT_CMP0135=NEW

      - name: Build
        run: cmake --build build-anc --parallel

      - name: Run 22 GoogleTests
        run: ctest --test-dir build-anc --output-on-failure -V

      - name: Run 13 pytest (Python design layer)
        run: uv run --directory automotive_anc_engine/design pytest tests/ -v

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install Python deps
        run: uv sync --frozen
      - name: Run pytest
        run: |
          uv run pytest tools/test_tools.py -v
          uv run pytest tests/test_telemetry.py -v

  sensys-test:
    name: Magnetometer Survey — 10 GoogleTests (ubuntu, no Qt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (standalone survey_processor lib)
        run: >
          cmake -S magnetometer_survey_visualizer/lib/survey_processor -B build-sensys
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_DEFAULT_CMP0135=NEW

      - name: Build
        run: cmake --build build-sensys --parallel

      - name: Run 10 GoogleTests
        run: ctest --test-dir build-sensys --output-on-failure -V
